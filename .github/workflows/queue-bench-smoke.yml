name: Queue-bench smoke (nightly)

# Issue #1163 で queue-bench の orchestration 非決定性 (3 stack 並列起動で
# random に 1 stack が ok=0 になる) を `--force-recreate` で解消した。同種の
# regression が再発した場合に nightly で検知するための smoke workflow。
#
# - `make queue-bench-up → seed → inbound (small N) → down` を 1 サイクル
#   走らせる。inbound を **count=100 / concurrency=16** に絞ることで、
#   seed-time の `network not found` 失敗 mode と bench-time の `ok=0`
#   失敗 mode の両方を catch する (= issue #1163 history table の Run 2/3
#   で観測された後者の manifestation もカバー)。実際の load 計測は
#   手動 / 別タスクで継続。
# - inbound 結果 (`tests/queue-bench/results/inbound.json`) を assert step
#   でパースして「全 3 stack が ok==sent」を verify。partial ok=0 だと
#   driver_inbound 自体は exit 0 で抜けるので、assertion なしでは regression
#   を検知できない。
# - schedule: 毎日 1 回 (UTC 17:30 ≒ JST 02:30)。dropin-e2e (18:00) と
#   playwright (17:00) の間にずらして runner 競合を避ける。
# - workflow_dispatch: 任意の ref で手動発火可。
# - PR の required check には**入れない**。8-10 min かかる上に
#   docker-in-docker / 3 stack 並列という flaky 要素を含むため merge ブロッカー
#   に向かない。failure は Actions 上で確認、別 PR で対処する運用
#   (dropin-e2e / playwright と同じ方針)。

on:
  schedule:
    # 17:30 UTC (= JST 02:30)。dropin-e2e (18:00) / playwright (17:00) と
    # 30 分ずらして runner queue 競合を避ける。
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / SHA to test"
        required: false
        default: "develop"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    # 25 min: cache miss 時の pnpm install + frontend build (~5-10 min) +
    # image build + up + seed + small-N inbound + down で 18-20 min 程度を
    # 想定し、5 min バッファ。dropin-e2e と timeout を揃える。
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          # schedule 起動時 inputs は空 → develop fallback。
          ref: ${{ inputs.ref || 'develop' }}
          # tests/federation/common/Dockerfile.mkgo が
          # third_party/misskey/built/ + node_modules/ を COPY するので
          # submodule を先に展開しないと docker build が "failed to compute
          # cache key" で死ぬ (dropin-e2e.yml と同じ理由、#1163)。
          submodules: recursive

      # Misskey TS の pnpm install + frontend build を node_modules / built/
      # ごと cache する。dropin-e2e.yml / playwright.yml と同 strategy で
      # cache hit すれば 5-10 min → 数秒に短縮できる。
      - name: Cache misskey workspace (built + node_modules)
        id: cache-misskey
        uses: actions/cache@v4
        with:
          path: |
            third_party/misskey/node_modules
            third_party/misskey/packages/*/node_modules
            third_party/misskey/built
          key: misskey-workspace-${{ runner.os }}-${{ hashFiles('third_party/misskey/pnpm-lock.yaml') }}

      - name: Set up Node.js
        if: steps.cache-misskey.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build third_party/misskey frontend bundle
        if: steps.cache-misskey.outputs.cache-hit != 'true'
        working-directory: third_party/misskey
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm install --frozen-lockfile
          pnpm build

      # smoke 本体: up → seed → small-N inbound → down を 1 サイクル。
      #
      # seed 完走で seed-time の orchestration regression (= `network <hash>
      # not found` 系) を catch、 small-N inbound (count=100 / concurrency=16)
      # で bench-time の `ok=0` 失敗 manifestation を catch する。N を 100 に
      # 絞ることで実行時間を ~10 sec に抑えつつ、stack が完全に broken state で
      # 起動した場合 (= ok=0) を確実に検知できる。実際の load 計測は手動 /
      # 別タスクで継続 (= bench は load test であり regression test ではない、
      # という分業を維持)。
      - name: queue-bench smoke (up + seed)
        run: |
          make queue-bench-up
          make queue-bench-seed

      - name: queue-bench smoke (small-N inbound)
        env:
          INBOUND_COUNT: "100"
          INBOUND_CONCURRENCY: "16"
        run: make queue-bench-inbound

      - name: Assert all stacks reached ok=sent
        # driver_inbound.py は partial ok=0 でも exit 0 で抜けるので、
        # ここで inbound.json をパースして「全 3 stack で ok == sent」を
        # verify する。1 stack でも `ok < sent` なら CI fail にして
        # orchestration regression を early surface する。
        # quoted heredoc (`'PYEOF'`) で shell interpolation を止めつつ、
        # Python f-string 内では `'target'` のように single quote subscript
        # を使って `\"` escape (Python 3.11 以下では f-string で禁止) を避ける。
        run: |
          python3 << 'PYEOF'
          import json, sys
          with open("tests/queue-bench/results/inbound.json") as f:
              d = json.load(f)
          bad = []
          for s in d["send"]["stats"]:
              if s["ok"] != s["sent"]:
                  bad.append(
                      f"{s['target']}: ok={s['ok']}/{s['sent']} failed={s['failed']}"
                  )
          if bad:
              print("FAIL: inbound smoke detected partial failure:", file=sys.stderr)
              for b in bad:
                  print(f"  {b}", file=sys.stderr)
              sys.exit(1)
          print(f"PASS: all {len(d['send']['stats'])} stacks ok=sent")
          PYEOF

      - name: queue-bench smoke (down)
        # assertion fail でもここまで来たいので step を分ける。実際は
        # if: always() の Final teardown でも掃除されるが、明示的に
        # successful path を残しておく方が log が読みやすい。
        if: success()
        run: make queue-bench-down

      # 失敗時のみ docker compose logs を artifact 化して原因調査できるよう
      # にする。`if: failure()` で正常時はアップロードしない。
      - name: Capture docker compose logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/queue-bench-logs
          docker compose -f tests/queue-bench/docker-compose.queue-bench.yml logs \
            > /tmp/queue-bench-logs/compose.log 2>&1 || true
          docker compose -f tests/queue-bench/docker-compose.queue-bench.yml ps \
            > /tmp/queue-bench-logs/ps.log 2>&1 || true

      - name: Upload logs artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: queue-bench-logs
          path: /tmp/queue-bench-logs/
          if-no-files-found: ignore
          retention-days: 14

      # 念のため明示 teardown (前 step が timeout 等で down に到達しない
      # ケースに備える)。
      - name: Final teardown
        if: always()
        run: |
          make queue-bench-down >/dev/null 2>&1 || true
