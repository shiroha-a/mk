name: Drop-in e2e (nightly)

# Phase 13-4 (#374): drop-in 切替 e2e (`make dropin-swap-test`) を CI で
# 定期実行して TS↔mk 互換性の regression を自動検知する。
#
# - schedule: 毎日 1 回 (UTC 18:00 ≒ JST 03:00) に走る
# - workflow_dispatch: リリース前に手動で発火できる
# - PR の required check には**入れない**。8-10 min かかる上に federation
#   delivery 経路が flaky な要素を含むため、merge ブロッカーには適さない。
#   失敗は Actions 上で確認し、別 PR で対処する運用。

on:
  schedule:
    # 毎日 18:00 UTC (= JST 03:00)。develop ブランチに対して走る。
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / SHA to test"
        required: false
        default: "develop"

permissions:
  contents: read

jobs:
  swap-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          # schedule 起動時 inputs は空なので github.sha (= 既定ブランチ HEAD)
          # に落ちる。本 workflow は drop-in 互換 regression を nightly で
          # 監視するもので、`develop` への変更が対象なので明示的に develop を
          # 指定する (Devin #375 #1)。
          ref: ${{ inputs.ref || 'develop' }}
          # tests/federation/common/Dockerfile.mkgo が
          # third_party/misskey/built/ + assets/ を COPY するので submodule
          # を先に展開しないと docker build が "failed to compute cache key"
          # で死ぬ (#954 で frontend bundle COPY が追加され、2026-05-09
          # nightly から本問題が顕在化)。
          submodules: recursive

      # Dockerfile.mkgo が third_party/misskey/built/_frontend_vite_ 等を
      # COPY する。これは `pnpm build` の成果物で submodule に commit され
      # ていないので、docker build より前に host で run しておく。
      #
      # actions/cache で built/ + node_modules を pin (playwright.yml と同じ
      # 戦略)。submodule の pnpm-lock.yaml hash をキーに使うので、Misskey
      # upstream を pin し直さない限り cache hit で 5-10 min → 数秒に短縮。
      - name: Cache misskey workspace (built + node_modules)
        id: cache-misskey
        uses: actions/cache@v4
        with:
          # packages/*/node_modules で全 workspace package を glob 対応
          # (新 package 追加時に手動更新不要)。built/ は pnpm build の成果物。
          path: |
            third_party/misskey/node_modules
            third_party/misskey/packages/*/node_modules
            third_party/misskey/built
          key: misskey-workspace-${{ runner.os }}-${{ hashFiles('third_party/misskey/pnpm-lock.yaml') }}

      - name: Set up Node.js
        if: steps.cache-misskey.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build third_party/misskey frontend bundle
        if: steps.cache-misskey.outputs.cache-hit != 'true'
        working-directory: third_party/misskey
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm install --frozen-lockfile
          pnpm build

      - name: Pre-pull Misskey TS image
        # 旧版は `&` で background 化していたが、GitHub Actions の `run:`
        # step は step 終了で shell process が exit するため background
        # process の継続が runner 環境で保証されない (= pre-pull 効果が
        # 不確実)。foreground で完了を待ち、続く `make dropin-swap-test`
        # 内の同 image pull は docker daemon の cache hit で 0s で済む方が
        # 確実。playwright.yml (#816) と同じ判断。
        run: docker pull misskey/misskey:2025.2.1

      # bash orchestrator + pytest を実行する。stage ログは標準出力に流れる。
      - name: Run dropin swap test
        run: make dropin-swap-test

      # 失敗時のみ docker compose logs を artifact 化して原因調査できるようにする。
      # `if: failure()` で正常時はアップロードしない。
      - name: Capture docker compose logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/dropin-logs
          docker compose -f docker-compose.dropin.yml -f docker-compose.dropin.mk.yml logs \
            > /tmp/dropin-logs/compose.log 2>&1 || true
          docker compose -f docker-compose.dropin.yml -f docker-compose.dropin.mk.yml ps \
            > /tmp/dropin-logs/ps.log 2>&1 || true

      - name: Upload logs artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dropin-logs
          path: /tmp/dropin-logs/
          if-no-files-found: ignore
          retention-days: 14

      # cleanup は orchestrator の trap で済んでいるが、CI runner 上では
      # 念のため明示的に呼ぶ (orchestrator が timeout 等で trap が走らない
      # ケースに備えて)。
      - name: Final teardown
        if: always()
        run: |
          docker compose -f docker-compose.dropin.yml -f docker-compose.dropin.mk.yml down -v \
            >/dev/null 2>&1 || true

  # nightly が壊れたまま放置されるのを防ぐ。schedule 実行が失敗したときだけ
  # issue を起票し、既に open な同名 issue があれば何もしない (重複抑止)。
  # 手動 dispatch では起票しない。
  #
  # 背景: 本 workflow は最後の success から数十日以上 failure が続いていたが、
  # PR の required check に入っておらず通知も無かったため気付かれなかった。
  # 原因を解消したら起票された issue を close すること (次回失敗時に再起票)。
  notify-failure:
    needs: [swap-test]
    if: ${{ always() && github.event_name == 'schedule' && needs.swap-test.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open tracking issue when absent
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "nightly dropin-e2e が失敗しています"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "既に open な issue #$existing があるので起票しない"
            exit 0
          fi
          {
            printf 'nightly workflow `%s` が失敗しました。\n\n' "dropin-e2e"
            printf -- '- 失敗した run: %s\n' "$RUN_URL"
            printf -- '- 対象 branch: develop\n\n'
            printf 'この issue は nightly の schedule 実行が失敗したときに自動起票されます。\n'
            printf '既に open な同名 issue がある間は重複起票しません。原因を解消したら\n'
            printf 'この issue を close してください (次回失敗時に再度起票されます)。\n'
          } > /tmp/nightly-issue.md
          gh issue create --title "$TITLE" --body-file /tmp/nightly-issue.md
