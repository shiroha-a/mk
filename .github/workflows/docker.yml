name: Docker

# GHCR (ghcr.io/<owner>/<repo>) にメインの runtime image を publish する。
#
# - develop / main への push と `v*` タグ push で実 push する。
# - PR では build だけ行って、動く Dockerfile かどうかを検証する (push はしない)。
#
# image 名は `${{ github.repository }}` をそのまま使うので、upstream では
# `ghcr.io/shiroha-a/mk`、fork では `ghcr.io/nananek/mk-go` になる。

on:
  push:
    branches: [main, develop]
    # このリポジトリのリリースタグは `1.1.1` 形式で `v` 接頭辞を付けない。
    # `v*` だけだと一度も一致せず、リリースを打ってもバージョン付き image が
    # publish されない状態だった (1.0.0 / 1.1.0 が GHCR に存在しなかった)。
    # 将来 `v` 付きで打たれても拾えるよう両方を条件に残す。
    tags: ["[0-9]+.[0-9]+.[0-9]+", "v*"]
  pull_request:
    branches: [main, develop]
  # push 済みのタグから image を publish し直すための入口。
  #
  # `--ref <tag>` では実行できない。workflow_dispatch は **dispatch 対象の ref に
  # あるファイル** に定義されている必要があり、過去のタグが指すコミットには
  # このトリガーが無いため。したがって develop に対して実行し、ビルドしたい
  # タグは tag input で渡す。
  #
  #   gh workflow run docker.yml -f tag=1.1.1
  #
  # タグを打ち直すのは破壊的なので、取りこぼしはこちらで拾う。
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. 1.1.1). Empty = build the branch."
        required: false
        default: ""

# ghcr.io に push するには packages: write が必要。
# contents: read は checkout 用。
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # tag input が指定されていればそのタグを、無ければ通常どおり
          # イベントの ref を build する。
          ref: ${{ inputs.tag || github.ref }}
          # third_party/misskey (packages/backend/assets など) がDockerfileの
          # COPY対象になるため、submoduleを取得しないとbuildが失敗する。
          submodules: recursive

      # Dockerfileが /twemoji (本家frontendの絵文字SVG set) をCOPYするが、
      # その実体は third_party/misskey/packages/backend/node_modules/@discordapp/twemoji
      # 配下にあり、pnpm install 後にしか存在しない。runner上で事前にinstallして
      # Docker build contextに含める (issue #359)。
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # third_party/misskey/packages/backend は engines.node で
          # ^22.15.0 || ^24.10.0 を要求するため 22 系を使う。
          node-version: "22"

      - name: Install third_party/misskey node_modules
        working-directory: third_party/misskey
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PR の場合は push しないので login 不要。fork からの PR で secrets が
      # 使えないケースでも build だけは回せるようにしておく。
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tag 付けルール:
      #   - branch 名 (develop / main)
      #   - `sha-<shortsha>` (immutable 参照用)
      #   - git tag (v* 押した時)
      #   - `latest` (default branch = develop への push 時)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            # tag input 指定時のみ。push イベントでは空なので enable=false。
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=Misskey rewritten in Go
            org.opencontainers.image.source=${{ github.event.repository.html_url }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA の cache backend を使って layer を再利用し、build 時間を短縮する。
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # フロントエンドアセットを同梱した bundled image。pull しただけで起動できる
  # (docker-compose.image.yml / make image-up が使う)。
  #
  # 既存の build-and-push job とは独立している。あちらは従来どおり
  # `Dockerfile` からアセット非同梱の image を作るので、既存のビルド&起動
  # フローには影響しない。
  #
  # アセットは fork が publish する専用 image から COPY するため、この job は
  # submodule も pnpm install も必要としない (= 既存 job のような事前準備が
  # 一切要らない)。
  build-and-push-bundled:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
        # submodule は不要。Dockerfile.bundled は third_party/misskey を参照せず、
        # アセットを assets image から取る。

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 既存 image と同じリポジトリに `-bundled` suffix 付きで publish する。
          tags: |
            type=semver,pattern={{version}},suffix=-bundled
            type=semver,pattern={{major}}.{{minor}},suffix=-bundled
            type=sha,prefix=sha-,suffix=-bundled,format=short
            type=raw,value=bundled,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},suffix=-bundled,enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=Misskey rewritten in Go (frontend assets bundled)
            org.opencontainers.image.source=${{ github.event.repository.html_url }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.bundled
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
