name: Drop-in frontend e2e (nightly)

# Phase 14-3 (#394): 3 Misskey TS + cypress の drop-in 互換 e2e を CI で
# 定期実行する。pytest 版 (`dropin-e2e.yml` #374) と同様の運用で、PR の
# required check には**含めない** (15-30 min かかり flaky 要素を含むため)。
#
# - schedule: 毎日 UTC 19:00 (pytest 版 18:00 の 1h 後にずらして runner 圧縮)
# - workflow_dispatch: 手動実行 (baseline-only / swap 両方選択可)

on:
  schedule:
    # 19:00 UTC = 04:00 JST。
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / SHA to test"
        required: false
        default: "develop"
      mode:
        description: "Test mode: swap (default, full baseline+swap) / baseline (only TS-only)"
        required: false
        default: "swap"
        type: choice
        options:
          - swap
          - baseline

permissions:
  contents: read

jobs:
  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'develop' }}
          # stage 3 の mk-go image build (tests/federation/common/Dockerfile.mkgo)
          # が third_party/misskey/built/ と assets/ を COPY するので、submodule
          # を展開しないと "failed to calculate checksum ... not found" で死ぬ。
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # frontend bundle (built/_frontend_vite_ / _frontend_dist_ / _sw_dist_) は
      # repo に commit されていないのでここで生成する。playwright workflow が
      # 同じことをしており、こちらだけ欠けていたため stage 2 (cypress baseline)
      # を通過した後の stage 3 で必ず docker build に失敗していた。
      - name: Build third_party/misskey frontend bundle
        working-directory: third_party/misskey
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm install --frozen-lockfile
          pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pre-pull heavy images
        # 旧版は `&` で background 化していたが、GitHub Actions の `run:`
        # step は step 終了で shell process が exit するため background
        # process の継続が runner 環境で保証されない (= pre-pull 効果が
        # 不確実)。foreground で完了を待ち、続く `make dropin-frontend-*`
        # 内の同 image pull は docker daemon の cache hit で 0s で済む方が
        # 確実。playwright.yml (#816) と同じ判断。2 image を順次 pull。
        run: |
          docker pull misskey/misskey:2025.2.1
          docker pull cypress/included:15.11.0

      - name: Run dropin frontend e2e
        # DROPIN_LOG_DIR をセットして orchestrator の cleanup trap に失敗時
        # ログの保存先を教える (Devin #398 #1): trap 内で `down -v` する前に
        # 保存しないと CI 側の `if: failure()` が走る頃にはコンテナが消えて
        # logs が空になる。
        env:
          DROPIN_LOG_DIR: /tmp/dropin-frontend-logs
        run: |
          mkdir -p /tmp/dropin-frontend-logs
          if [ "${{ inputs.mode || 'swap' }}" = "baseline" ]; then
            make dropin-frontend-baseline
          else
            make dropin-frontend-swap-test
          fi

      # 失敗時のみ cypress 成果物を追加で取り込む。compose logs / ps は
      # orchestrator の cleanup が既に上書きしているので重複無し。
      - name: Capture cypress artifacts on failure
        if: failure()
        run: |
          mkdir -p /tmp/dropin-frontend-logs
          if [ -d tests/dropin_frontend/cypress/cypress ]; then
            cp -r tests/dropin_frontend/cypress/cypress /tmp/dropin-frontend-logs/ || true
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dropin-frontend-logs
          path: /tmp/dropin-frontend-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Final teardown
        if: always()
        run: |
          docker compose -f docker-compose.dropin-frontend.yml \
            -f docker-compose.dropin-frontend.mk.yml down -v \
            >/dev/null 2>&1 || true

  # nightly が壊れたまま放置されるのを防ぐ。schedule 実行が失敗したときだけ
  # issue を起票し、既に open な同名 issue があれば何もしない (重複抑止)。
  # 手動 dispatch では起票しない。
  #
  # 背景: 本 workflow は最後の success から数十日以上 failure が続いていたが、
  # PR の required check に入っておらず通知も無かったため気付かれなかった。
  # 原因を解消したら起票された issue を close すること (次回失敗時に再起票)。
  notify-failure:
    needs: [frontend-e2e]
    if: ${{ always() && github.event_name == 'schedule' && needs.frontend-e2e.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open tracking issue when absent
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "nightly dropin-frontend-e2e が失敗しています"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "既に open な issue #$existing があるので起票しない"
            exit 0
          fi
          {
            printf 'nightly workflow `%s` が失敗しました。\n\n' "dropin-frontend-e2e"
            printf -- '- 失敗した run: %s\n' "$RUN_URL"
            printf -- '- 対象 branch: develop\n\n'
            printf 'この issue は nightly の schedule 実行が失敗したときに自動起票されます。\n'
            printf '既に open な同名 issue がある間は重複起票しません。原因を解消したら\n'
            printf 'この issue を close してください (次回失敗時に再度起票されます)。\n'
          } > /tmp/nightly-issue.md
          gh issue create --title "$TITLE" --body-file /tmp/nightly-issue.md
